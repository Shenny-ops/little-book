<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A Little Book of Memories — 耀隆 &amp; 美辰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=DM+Serif+Display&amp;family=LXGW+WenKai+TC:wght@400;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@600&amp;display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">

<!-- 00 封面 -->
<section id="cover" class="cover" aria-label="封面">
  <p class="cover__line hand" id="openingLine"></p>
  <div class="envelope" id="envelope">
    <div class="envelope__back"></div>
    <div class="letter" id="letter">
      <p class="letter__to hand" id="letterTo"></p>
      <h1 class="letter__title serif" id="letterTitle"></h1>
      <p class="letter__body" id="letterBody"></p>
      <a class="letter__next" href="#characters">往下翻 <span aria-hidden="true">↓</span></a>
      <figure class="letter__cat">
        <img src="images/characters/dingding.jpg" alt="丁丁" width="480" height="480">
        <figcaption>丁丁也來了</figcaption>
        <svg class="letter__hearts" aria-hidden="true" viewBox="0 0 60 40"><path d="M14 30 C2 21 4 10 11 10 C15 10 16 14 16 14 C16 14 18 9 22 10 C29 11 28 22 14 30Z" fill="#D9272E" stroke="#252525" stroke-width="1.6"/><path d="M44 20 C36 14 37 6 42 6 C45 6 46 9 46 9 C46 9 48 5 51 6 C56 7 55 15 44 20Z" fill="#D9272E" stroke="#252525" stroke-width="1.6"/></svg>
      </figure>
    </div>
    <div class="envelope__front">
      <svg class="envelope__pocket" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 100 L50 52 L100 100" fill="none" stroke="#252525" stroke-width="2" vector-effect="non-scaling-stroke" opacity=".35"/></svg>
      <div class="envelope__address">
        <p class="hand" id="addressTo"></p>
        <p class="serif" id="addressTitle"></p>
      </div>
    </div>
    <div class="envelope__flap">
      <svg aria-hidden="true" viewBox="0 0 100 55" preserveAspectRatio="none"><path d="M0 0 L50 54 L100 0" fill="#E2CFA8" stroke="#252525" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
      <span class="seal serif" id="seal"></span>
    </div>
    <div class="stamp"><div class="stamp__inner serif" id="stamp"></div></div>
    <div class="postmark" id="postmark"></div>
  </div>
  <button class="btn btn--red cover__btn" id="openBtn" type="button">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg>
    打開這封信
  </button>
  <button class="cover__skip" id="skipBtn" type="button">跳過動畫 →</button>
</section>

<main id="content">
  <!-- 01 主角介紹 -->
  <section id="characters" class="section characters">
    <header class="sec-head reveal">
      <p class="eyebrow">PROLOGUE</p>
      <h2 class="serif">Meet Our Favorite Characters</h2>
      <p class="hand sec-head__sub">本故事的兩位主角</p>
    </header>
    <div class="characters__grid" id="characterGrid"></div>
  </section>

  <!-- 02 回憶篇章 -->
  <section id="memories" class="memories" aria-label="回憶篇章">
    <div id="chapters"></div>
  </section>

  <!-- 03 留言 -->
  <section id="messages" class="section messages">
    <header class="sec-head reveal">
      <p class="eyebrow">CHAPTER FIVE</p>
      <h2 class="serif">Messages from Friends</h2>
      <p class="hand sec-head__sub" id="messagesSub"></p>
    </header>
    <div class="mosaic" id="mosaic"></div>
    <div class="msg-grid" id="msgGrid"></div>
    <div class="msg-more">
      <button class="btn btn--red" id="moreBtn" type="button">再拆 12 封信</button>
      <span class="hand" id="moreCount"></span>
    </div>
  </section>

  <!-- 04 結尾 -->
  <section id="ending" class="ending">
    <div class="ending__sky" id="stars" aria-hidden="true"></div>
    <div class="ending__inner">
      <figure class="polaroid ending__photo reveal" id="endingPhoto"></figure>
      <div class="ending__text">
        <p class="serif ending__lead reveal" id="endLead"></p>
        <p class="ending__body reveal" id="endBody"></p>
        <p class="hand ending__note reveal" id="endNote"></p>
      </div>
    </div>
    <p class="serif ending__final reveal" id="endFinal"></p>
    <a class="ending__again" href="#top" id="againBtn">從頭再翻一次 ↺</a>
    <svg class="ending__hill" aria-hidden="true" viewBox="0 0 1440 220" preserveAspectRatio="none">
      <path d="M0 120 C 300 60, 620 170, 900 110 S 1300 40, 1440 90 L1440 220 L0 220 Z" fill="#16304F" stroke="#FFFDF5" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="ending__house" aria-hidden="true" viewBox="0 0 90 80">
      <path d="M5 38 L45 4 L85 38 Z" fill="#1E3A5F" stroke="#FFFDF5" stroke-width="2.5"/>
      <rect x="13" y="38" width="64" height="40" fill="#1E3A5F" stroke="#FFFDF5" stroke-width="2.5"/>
      <rect class="window" x="36" y="48" width="18" height="18" fill="#F4D84B"/>
    </svg>
  </section>
</main>

<!-- 照片放大 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片放大" hidden>
  <button class="icon-btn lightbox__close" id="lbClose" type="button" aria-label="關閉">×</button>
  <button class="icon-btn lightbox__prev" id="lbPrev" type="button" aria-label="上一張">‹</button>
  <figure class="lightbox__fig">
    <div class="lightbox__img" id="lbImg"></div>
    <figcaption class="hand" id="lbCap"></figcaption>
  </figure>
  <button class="icon-btn lightbox__next" id="lbNext" type="button" aria-label="下一張">›</button>
</div>

<!-- 完整留言 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mdName" hidden>
  <div class="modal__paper">
    <div class="modal__top">
      <span class="hand" id="mdCount"></span>
      <button class="icon-btn" id="mdClose" type="button" aria-label="關閉">×</button>
    </div>
    <p class="hand modal__to" id="mdTo"></p>
    <h3 class="serif modal__name" id="mdName"></h3>
    <div class="modal__text" id="mdTextWrap">
      <div class="modal__photos" id="mdPhotos"></div>
      <div id="mdText"></div>
    </div>
    <div class="modal__nav">
      <button class="btn" id="mdPrev" type="button">‹ 上一封</button>
      <button class="btn btn--red" id="mdNext" type="button">下一封 ›</button>
    </div>
  </div>
</div>

<button class="to-top" id="toTop" type="button" aria-label="回到頂端">↑</button>

<script src="data/site.js"></script>
<script src="data/characters.js"></script>
<script src="data/photos.js"></script>
<script src="data/messages.js"></script>
<script src="data/quotes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
